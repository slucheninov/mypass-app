name: Release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  release-macos:
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate tag and signing secrets
        run: |
          set -euo pipefail
          bash scripts/check-version.sh --tag "$GITHUB_REF_NAME"
          [[ "$APPLE_SIGNING_IDENTITY" =~ ^[0-9A-Fa-f]{40}$ ]] || { echo 'Missing certificate SHA-1 signing identity'; exit 1; }
          [[ -n "$APPLE_CERTIFICATE" && -n "$APPLE_CERTIFICATE_PASSWORD" ]] || { echo 'Missing Apple Development certificate secrets'; exit 1; }
          bash scripts/check-host-deps.sh
      - name: Test
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          bash scripts/test.sh --ci
      - name: Import Apple Development certificate
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/mypass-release.keychain-db"
          certificate="$RUNNER_TEMP/mypass-signing.p12"
          umask 077
          python3 -c 'import base64,os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "mypass-signing.p12").write_bytes(base64.b64decode(os.environ["APPLE_CERTIFICATE"], validate=True))'
          password="$(openssl rand -hex 32)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security find-identity -v -p codesigning "$keychain" | grep -iF "$APPLE_SIGNING_IDENTITY" | grep -F 'Apple Development:'
          rm -f "$certificate"
      - name: Package and check the artifact set
        run: |
          bash scripts/package-macos.sh --release --out "$RUNNER_TEMP/mypass-assets"
          python3 scripts/release.py check-assets "$RUNNER_TEMP/mypass-assets" "${GITHUB_REF_NAME#v}" --platform macos
      - name: Create draft release and verify draft assets
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          # A failed API call is not evidence that the release is absent.
          releases="$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | {tag_name, draft}')"
          existing="$(jq -sr --arg tag "$tag" '[.[] | select(.tag_name == $tag)] | if length == 0 then "absent" elif .[0].draft then "draft" else "published" end' <<< "$releases")"
          if [[ "$existing" == published ]]; then echo 'Release is already published'; exit 1; fi
          if [[ "$existing" == draft ]]; then gh release delete "$tag" --yes; fi
          python3 scripts/release.py notes "${tag#v}" "$RUNNER_TEMP/notes.md"
          # Bash 3.2 (macOS runners) treats a bare empty-array expansion as unbound under set -u.
          flags=()
          if [[ "$tag" == *-* ]]; then flags=(--prerelease --latest=false); fi
          gh release create "$tag" --verify-tag --draft ${flags[@]+"${flags[@]}"} --title "MyPass ${tag#v}" --generate-notes --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/mypass-assets/"*
          gh release download "$tag" --dir "$RUNNER_TEMP/draft-assets"
          python3 scripts/release.py check-assets "$RUNNER_TEMP/draft-assets" "${tag#v}" --platform macos
      - name: Delete temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/mypass-signing.p12"
          if [[ -f "$RUNNER_TEMP/mypass-release.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/mypass-release.keychain-db"
          fi
  release-windows:
    needs: [release-macos]
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # Local helper imports must leave the exact-tag checkout clean for --release.
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate this tag on Windows
        run: |
          set -euo pipefail
          bash scripts/check-version.sh --tag "$GITHUB_REF_NAME"
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          bash scripts/test.sh --ci
          bash scripts/check-host-deps.sh --target x86_64-pc-windows-msvc
      - name: Report real OS integration boundary
        run: echo 'Real OS integration tests are opt-in and were not run by this release job; see RUN.md.'
      - name: Build and verify unsigned Windows release
        run: |
          set -euo pipefail
          bash scripts/package-windows.sh --release --version "${GITHUB_REF_NAME#v}" --out "$RUNNER_TEMP/windows-assets"
          python3 scripts/release.py check-assets "$RUNNER_TEMP/windows-assets" "${GITHUB_REF_NAME#v}" --platform windows
          target_dir="$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          python3 scripts/windows-host-smoke.py "$RUNNER_TEMP/windows-assets/MyPass-${GITHUB_REF_NAME#v}-windows-x64.zip" "$target_dir/x86_64-pc-windows-msvc/release"
      - name: Attach Windows files to the draft
        run: |
          set -euo pipefail
          [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" == true ]]
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/windows-assets/MyPass-${GITHUB_REF_NAME#v}-windows-x64.zip" "$RUNNER_TEMP/windows-assets/MyPass-${GITHUB_REF_NAME#v}-windows-x64.zip.sha256" --clobber
  publish:
    needs: [release-macos, release-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MACOS_RESULT: ${{ needs.release-macos.result }}
      WINDOWS_RESULT: ${{ needs.release-windows.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Re-verify draft assets and publish last
        run: |
          set -euo pipefail
          bash scripts/publish-release.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/publish-assets" "$MACOS_RESULT" "$WINDOWS_RESULT"
