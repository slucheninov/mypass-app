[package]
name = "mypass-platform"
version = "0.1.0"
description = "MyPass OS glue behind traits: clipboard, secret store, system events."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# Exposes `mypass_platform::testing` (the fakes) to other crates' tests; never enable in production.
test-util = []

[dependencies]
secrecy.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
arboard.workspace = true
