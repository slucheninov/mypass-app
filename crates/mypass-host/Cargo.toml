[package]
name = "mypass-host"
version = "0.1.0"
description = "MyPass native messaging host: relays the extension to the app over loopback."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "mypass-host"
path = "src/main.rs"

[dependencies]
# No `server` feature: the host never links the session, the core or the KDBX engine.
mypass-bridge = { path = "../mypass-bridge", default-features = false }
mypass-platform = { path = "../mypass-platform" }

[dev-dependencies]
# The e2e tests run the real server and session in-process; only the test build links them, the
# shipped host (`[dependencies]` above) never does (guard `host_links_no_vault_code`).
mypass-bridge = { path = "../mypass-bridge" }
mypass-core = { path = "../mypass-core" }
mypass-kdbx = { path = "../mypass-kdbx" }
mypass-platform = { path = "../mypass-platform", features = ["test-util"] }
mypass-session = { path = "../mypass-session" }
secrecy.workspace = true
uuid.workspace = true
serde_json.workspace = true
tempfile.workspace = true
