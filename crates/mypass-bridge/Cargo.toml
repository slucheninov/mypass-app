[package]
name = "mypass-bridge"
version = "0.1.0"
description = "MyPass browser bridge: protocol, codec, endpoint, relay and the loopback server."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["server"]
# The app-side server. The native messaging host builds with `default-features = false`, so it never
# links the vault code (guard `host_links_no_vault_code`).
server = ["dep:mypass-session", "dep:mypass-core", "dep:mypass-kdbx", "dep:url"]

[dependencies]
# Not gated: the endpoint store and the relay need `SecretStore` and `AppPaths`.
mypass-platform = { path = "../mypass-platform" }
mypass-session = { path = "../mypass-session", optional = true }
mypass-core = { path = "../mypass-core", optional = true }
mypass-kdbx = { path = "../mypass-kdbx", optional = true }
base64.workspace = true
hmac.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
url = { workspace = true, optional = true }
uuid = { workspace = true, features = ["serde"] }
zeroize.workspace = true

[dev-dependencies]
secrecy.workspace = true
tempfile.workspace = true
mypass-platform = { path = "../mypass-platform", features = ["test-util"] }
# `FailingFileIo` for the passkey durability tests.
mypass-kdbx = { path = "../mypass-kdbx", features = ["test-util"] }
# Verify passkey create responses independently of the encoder (signature and CBOR).
p256.workspace = true
ciborium.workspace = true
