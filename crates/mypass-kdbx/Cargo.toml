[package]
name = "mypass-kdbx"
version = "0.1.0"
description = "From-scratch KDBX 4 engine for MyPass: format, model, database API and vault file."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
sha2.workspace = true
hmac.workspace = true
subtle.workspace = true
zeroize.workspace = true
argon2 = { workspace = true, features = ["alloc", "zeroize"] }
aes = { workspace = true, features = ["zeroize"] }
secrecy.workspace = true
getrandom.workspace = true
cbc = { workspace = true, features = ["block-padding", "zeroize"] }
chacha20 = { workspace = true, features = ["zeroize"] }
flate2.workspace = true
