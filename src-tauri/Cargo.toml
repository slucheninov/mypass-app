[package]
name = "mypass-app"
version = "0.7.1-alpha.3"
description = "The MyPass desktop app shell (Tauri 2)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "mypass_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
mypass-kdbx = { path = "../crates/mypass-kdbx" }
mypass-core = { path = "../crates/mypass-core" }
mypass-platform = { path = "../crates/mypass-platform" }
mypass-session = { path = "../crates/mypass-session" }
mypass-bridge = { path = "../crates/mypass-bridge" }
# The only crate that enables the HTTP client (`github` feature, R23); the update service that
# builds the `GitHubReleaseClient` lands with the app wiring.
mypass-update = { path = "../crates/mypass-update", features = ["github"] }
# `image-png` decodes the tray icons (the macOS template and the Windows key) and the
# theme-following app icons (the macOS Dock and the Windows window icons).
tauri = { workspace = true, features = ["image-png"] }
tauri-specta.workspace = true
specta.workspace = true
specta-typescript.workspace = true
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
zeroize.workspace = true
uuid.workspace = true
sys-locale.workspace = true
thiserror.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
window-vibrancy.workspace = true

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
tempfile.workspace = true
mypass-platform = { path = "../crates/mypass-platform", features = ["test-util"] }
mypass-kdbx = { path = "../crates/mypass-kdbx", features = ["test-util"] }

[lints]
workspace = true
