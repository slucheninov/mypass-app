# MyPass Cargo workspace.
#
# `members` is the `crates/*` glob plus "src-tauri", listed explicitly because the glob never
# picks it up (`src-tauri` is not under `crates/`). The guard test
# `workspace_members_are_the_crates_glob_until_src_tauri_exists` enforces this.
[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.package]
edition = "2021"
# Equal to the pinned toolchain in `rust-toolchain.toml` up to the patch version
# (guard test `toolchain_pins_agree`).
rust-version = "1.99.1"
license = "Apache-2.0"
repository = "https://github.com/slucheninov/mypass-app"

# The single version table for the whole rewrite (stages 1-3). Every third-party crate is declared
# here exactly once, with a full `x.y.z` version; members write `name.workspace = true` and never
# carry a version literal. `Cargo.lock` is committed and CI runs with `--locked`, so this table plus
# the lock file make builds reproducible. Later stages consume the table and never bump a version
# (a bump is its own `chore(deps)` commit). The tauri family, `specta` and `tauri-specta` are
# `=`-pinned: their pre-release / fast-moving versions must move together. Guard tests:
# `workspace_dependencies_are_exactly_pinned`, `member_crates_take_versions_only_from_the_workspace_table`.
[workspace.dependencies]
# --- RustCrypto primitives (no hand-rolled crypto) ---
aes = "0.9.4"
cbc = "0.2.1"
chacha20 = "0.10.2"
salsa20 = "0.11.0"
hmac = { version = "0.13.0", features = ["zeroize"] }
sha1 = "0.11.0"
sha2 = { version = "0.11.1", features = ["zeroize"] }
subtle = "2.6.1"
argon2 = "0.6.0"
# --- Compression, secrets, XML, encodings ---
flate2 = "1.1.11"
zeroize = "1.9.1"
secrecy = "0.10.3"
quick-xml = "0.42.0"
uuid = { version = "1.29.2", features = ["v4"] }
base64 = "0.23.1"
data-encoding = "2.11.1"
thiserror = "2.0.21"
idna = "1.1.0"
url = "2.5.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# rand stays on 0.8 (matches the RustCrypto traits used by the KDBX engine).
rand = { version = "0.8.8", features = ["std_rng"] }
getrandom = "0.4.3"
# P-256 ECDSA for passkeys; 0.14 needs rand_core 0.10, so keys are drawn with getrandom, not rand.
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "pkcs8", "pem", "std"] }

# --- Dev-only crates (tests, oracle, repo guards); never linked into a shipped artifact ---
tempfile = "3.27.0"
proptest = "1.12.0"
# Independent CBOR decoder for the passkey encoder tests only.
ciborium = "=0.2.2"
# keepass-rs is a test oracle only.
keepass = "0.17.0"
toml = "1.2.1"
serde_yaml_ng = "0.10.0"

# --- Declared now, first used from stage 2a (`=`-pinned) ---
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-build = "=2.7.4"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.2"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
# Used directly for the `Typescript` exporter handed to `tauri_specta::Builder::export`; the version
# is the one tauri-specta rc.26 depends on.
specta-typescript = "=0.0.13"

# --- Stage 2a: OS glue, clipboard, drafts, locale (consumed by later 2a tasks) ---
objc2 = "0.6.5"
# The default features of the two framework crates enable every class binding (minutes of build
# time); members list the classes they use.
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-app-kit = { version = "0.3.2", default-features = false }
block2 = "0.6.2"
# Keychain secret store (macOS only).
security-framework = { version = "3.7.0", default-features = false }
# `CFData` for the add-only `ItemAddOptions` call of the Keychain store.
core-foundation = "0.10.1"
# Stage 5: LocalAuthentication (device unlock, passkey presence check); same 0.3.x family as
# objc2-foundation, default features off, members list the classes they use.
objc2-local-authentication = { version = "=0.3.2", default-features = false }
# Stage 5: ServiceManagement `SMAppService` (launch at login, macOS 13+).
objc2-service-management = { version = "=0.3.2", default-features = false }
# `image-data` (default) would pull the `image` crate; only text is ever written.
arboard = { version = "3.7.0", default-features = false }
chacha20poly1305 = "0.11.0"
sys-locale = "0.3.2"
# Constants only (`O_NOFOLLOW`, `O_NONBLOCK`) for the file secret store; never an `unsafe` call.
libc = "0.2.191"

# Stage 6: the Win32 bindings already present in the locked Tauri graph.
windows = { version = "=0.62.2", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }

# --- Stage 5: sync ---
# Folder watcher of the secondary sync folder: FSEvents on macOS (the default `macos_fsevent`
# feature), `ReadDirectoryChangesW` on Windows.
notify = "=8.2.2"
# Safe wrappers for the guarded replacement of a remote vault (`renameat_with` with `EXCHANGE`
# and `NOREPLACE`) and the nonblocking open of the bounded read, in `mypass-kdbx` (unix only).
rustix = { version = "=1.1.6", default-features = false, features = ["std", "fs"] }

# --- Stage 5: update check ---
# HTTPS client of the GitHub release check, behind the `github` feature of `mypass-update` (only
# `src-tauri` enables it). TLS is the OS one (Security.framework on macOS, SChannel on Windows)
# and the roots are the OS trust store: `default-features = false` drops rustls and the bundled
# Mozilla root list, and the client config selects `RootCerts::PlatformVerifier` explicitly (the
# `WebPki` default would panic without the bundled list). No gzip, no cookies, no JSON feature.
ureq = { version = "=3.5.2", default-features = false, features = ["native-tls-no-default"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# `warn` here, `-D warnings` in CI: parsers must return `Err`, never panic. Tests are exempt
# through `clippy.toml` (`allow-*-in-tests`); non-test support code carries a file-level allow.
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"

# Argon2 with 64 MiB x 3 passes takes minutes at opt-level 0, so dependencies are optimised even
# in dev and test builds (our own crates stay at opt-level 0 for fast incremental builds).
[profile.dev.package."*"]
opt-level = 3

[profile.test.package."*"]
opt-level = 3
