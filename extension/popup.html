<!DOCTYPE html>
<html data-theme="system">
<head>
  <meta charset="utf-8">
  <title data-i18n="extName"></title>
  <link rel="stylesheet" href="shared/ui.css">
  <link rel="stylesheet" href="shared/prompt-card.css">
  <style>
    html {
      width: 400px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 400px;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      color: var(--mp-text);
      background: var(--mp-bg);
    }
    #panel-shell {
      position: relative;
    }
    .brand-key {
      display: block;
      width: 32px;
      height: 32px;
      margin: 0 auto 12px;
    }
    .brand-key--leading {
      margin: 0 0 12px;
    }
    h1.panel-title {
      font-size: 15px;
      font-weight: 600;
      margin: 0 0 6px;
      line-height: 1.3;
    }
    p.panel-helper {
      font-size: 13px;
      color: var(--mp-secondary);
      margin: 0 0 12px;
      line-height: 1.35;
    }
    p.list-header {
      font-size: 13px;
      font-weight: 600;
      color: var(--mp-text);
      margin: 0 0 8px;
    }
    .btn-primary,
    .btn-secondary {
      box-sizing: border-box;
      height: var(--mp-control-height, 32px);
      font-family: inherit;
      font-size: var(--mp-control-font, 13px);
      font-weight: var(--mp-control-weight, 600);
      line-height: 1;
      padding: 0 12px;
      border-radius: var(--mp-control-radius, 8px);
      cursor: pointer;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-primary {
      background: #007aff;
      color: #fff;
      border-color: #007aff;
    }
    .btn-secondary {
      background: var(--mp-fill);
      color: var(--mp-text);
      border-color: var(--mp-line);
      margin-left: 8px;
    }
    .btn-row {
      margin-top: 4px;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    li.credential-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 6px;
      border-radius: 8px;
      cursor: pointer;
    }
    li.credential-row:hover {
      background: var(--mp-fill);
    }
    .letter-avatar {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .letter-avatar-letter {
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      line-height: 1;
    }
    .credential-text {
      min-width: 0;
      flex: 1;
    }
    .credential-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.25;
    }
    .credential-username {
      font-size: 12px;
      color: var(--mp-secondary);
      line-height: 1.25;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    li.credential-row-unsaved {
      background: var(--mp-accent-soft);
    }
    .identifier-offer {
      margin: 4px 6px 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--mp-accent-soft);
    }
    .identifier-offer p {
      margin: 0 0 8px;
      line-height: 1.4;
    }
    .identifier-offer-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .identifier-offer .btn-secondary {
      margin-left: 0;
    }
    .totp-circle {
      position: relative;
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(127, 127, 127, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 11px;
      cursor: pointer;
      user-select: none;
    }
    .totp-circle .totp-ring {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .totp-circle .totp-ring circle {
      transition: stroke-dashoffset 1s linear;
    }
    .totp-circle-label {
      position: relative;
      z-index: 1;
    }
    .totp-circle.revealed {
      border-color: rgba(80, 160, 255, 0.6);
    }
    .totp-circle.copied {
      font-size: 9px;
      border-color: rgba(60, 200, 120, 0.6);
    }
    #pairing-panel .panel-title {
      margin-bottom: 12px;
    }
    #code-entry {
      margin-top: 12px;
    }
    #code-hint {
      margin: 0 0 6px;
      font-size: 12px;
      color: var(--mp-secondary);
    }
    #code-input {
      width: 100%;
      box-sizing: border-box;
      font-size: 16px;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    #pairing-error {
      color: #c00;
      font-size: 12px;
      margin: 8px 0 0;
    }
    #add-totp-section {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--mp-hairline);
    }
    #add-totp-hint {
      margin: 0 0 6px;
      font-size: 12px;
      color: var(--mp-secondary);
    }
    #totp-paste-input {
      width: 100%;
      box-sizing: border-box;
      font-size: 13px;
      margin-bottom: 8px;
    }
    #add-totp-error {
      color: #c00;
      font-size: 12px;
      margin: 8px 0 0;
    }
    .passkey-summary {
      overflow-wrap: anywhere;
    }
    .passkey-fields {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 8px 12px;
      margin: 12px 0 20px;
      font-size: 13px;
    }
    .passkey-fields dt { color: var(--mp-secondary); }
    .passkey-fields dd { margin: 0; overflow-wrap: anywhere; word-break: normal; }
    .passkey-summary:empty { display: none; }
    #passkey-picker-list {
      list-style: none;
      margin: 0 0 8px;
      padding: 0;
    }
    /* Header dropdowns (the "+" menu and the "more" menu) follow a macOS menu: plain rows in
       the popup font, a rounded accent highlight, hairline separators, shortcut hints right. */
    .mp-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 5;
      box-sizing: border-box;
      min-width: 210px;
      padding: 5px;
      background: var(--mp-bg);
      border: 1px solid var(--mp-hairline);
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
    }
    .mp-menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      box-sizing: border-box;
      min-height: 26px;
      margin: 0;
      padding: 3px 10px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--mp-text);
      font: inherit;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.3;
      text-align: left;
      cursor: default;
    }
    .mp-menu-item:hover,
    .mp-menu-item:focus-visible {
      background: #007aff;
      color: #fff;
      outline: none;
    }
    .mp-menu-item:disabled {
      opacity: 0.5;
    }
    .mp-menu-label {
      flex: 1;
      min-width: 0;
    }
    .mp-menu-shortcut {
      margin-left: 16px;
      color: var(--mp-secondary);
      font-size: 12px;
    }
    .mp-menu-item:hover .mp-menu-shortcut,
    .mp-menu-item:focus-visible .mp-menu-shortcut {
      color: inherit;
      opacity: 0.85;
    }
    .mp-menu-separator {
      height: 0;
      margin: 5px 10px;
      border: 0;
      border-top: 1px solid var(--mp-hairline);
    }
    .mp-help {
      width: 280px;
      padding: 8px;
    }
    .mp-help-back {
      font-weight: 600;
      margin-bottom: 4px;
    }
    .mp-help p {
      margin: 0;
      padding: 0 10px 4px;
    }
    /* A dropdown must not be clipped by a short popup (empty list, one row). */
    #panel-shell:has(.mp-menu:not([hidden])) {
      min-height: 230px;
    }
    #lock-vault-error {
      color: var(--mp-danger, #c33434);
      font-size: 12px;
      margin: 8px 0 0;
    }
    #browser-chrome {
      margin: 0 0 10px;
    }
    .browser-tools {
      display: flex;
      gap: 8px;
      align-items: center;
      position: relative;
    }
    #vault-search {
      flex: 1;
      min-width: 0;
      box-sizing: border-box;
      height: var(--mp-control-height, 32px);
      font-size: var(--mp-control-font, 13px);
      padding: 0 10px;
      border: 1px solid var(--mp-line, #d2d2d7);
      border-radius: var(--mp-control-radius, 8px);
      background: var(--mp-control-bg);
      color: var(--mp-text);
      outline: none;
    }
    .icon-btn {
      box-sizing: border-box;
      width: var(--mp-control-height, 32px);
      height: var(--mp-control-height, 32px);
      border-radius: var(--mp-control-radius, 8px);
      border: 1px solid var(--mp-line);
      background: var(--mp-control-bg);
      color: var(--mp-text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
    }
    #add-entry-btn {
      background: #007aff;
      color: #fff;
      border-color: #007aff;
      font-size: 22px;
      line-height: 1;
      font-weight: 400;
    }
    .category-wrap {
      position: relative;
      margin-top: 8px;
    }
    #category-btn {
      width: 100%;
      box-sizing: border-box;
      height: var(--mp-control-height, 32px);
      text-align: left;
      font-size: var(--mp-control-font, 13px);
      font-weight: var(--mp-control-weight, 600);
      padding: 0 10px;
      border-radius: var(--mp-control-radius, 8px);
      border: 1px solid var(--mp-line, #d2d2d7);
      background: var(--mp-fill, #f5f5f7);
      cursor: pointer;
    }
    #category-menu {
      position: absolute;
      z-index: 2;
      left: 0;
      right: 0;
      margin-top: 4px;
      background: var(--mp-bg);
      border: 1px solid var(--mp-hairline);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      padding: 4px;
    }
    .category-option {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      font-size: 13px;
      padding: 7px 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    .category-option:hover {
      background: var(--mp-fill);
    }
    .add-entry-icon {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .add-entry-icon svg {
      display: block;
    }
    .add-entry-icon-login { color: #2aa198; }
    .add-entry-icon-card { color: #007aff; }
    .add-entry-icon-note { color: #e68619; }
    .add-entry-icon-address { color: #af52de; }
    .add-entry-icon-files { color: #8e8e93; }
    .mp-menu-item:hover .add-entry-icon,
    .mp-menu-item:focus-visible .add-entry-icon {
      color: inherit;
    }
    .address-fill-chooser {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .address-fill-chooser p {
      margin: 0 0 4px;
      overflow-wrap: anywhere;
      line-height: 1.45;
    }
    .address-fill-option { width: 100%; margin-left: 0; box-sizing: border-box; text-align: left; }
    .address-fill-back { align-self: flex-start; margin-top: 8px; margin-left: 0; }
    #list {
      max-height: 360px;
      overflow: auto;
    }
    /* The unlock form sits in the optical centre of a fixed-height panel, so the popup does not
       open as a short strip with the form near the top. */
    #locked-panel:not([hidden]) {
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 12px;
      box-sizing: border-box;
      min-height: 300px;
      padding: 20px 12px 28px;
      text-align: center;
    }
    #locked-panel .panel-title {
      margin: 0;
      font-size: 18px;
    }
    #locked-helper { margin: 0; }
    #unlock-form { width: min(100%, 312px); }
    .unlock-password-field {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--mp-line);
      border-radius: 10px;
      background: var(--mp-fill);
    }
    .unlock-password-field:focus-within {
      border-color: #007aff;
    }
    #unlock-password {
      min-width: 0;
      flex: 1;
      border: 0;
      background: transparent;
      padding: 6px 8px;
      font: inherit;
      color: inherit;
    }
    #unlock-password:focus-visible { outline: 0; }
    #unlock-submit-btn { padding: 0 8px; }
    #unlock-form button:disabled {
      opacity: 0.55;
      cursor: default;
    }
    #unlock-error {
      min-height: 16px;
      margin: 8px 0 0;
      font-size: 12px;
      line-height: 16px;
      color: var(--mp-danger, #c33434);
    }
    /* The error line keeps its space while empty, so a wrong password does not move the form. */
    #unlock-error[hidden] {
      display: block !important;
      visibility: hidden;
    }
    #unlock-device-btn {
      margin: 10px 0 0;
      width: 100%;
    }

    .totp-badge {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(80, 160, 255, 0.15);
      color: #3b82f6;
    }
    .passkey-badge {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(52, 199, 89, 0.15);
      color: #248a3d;
    }
    p.passkey-detail {
      font-size: 11px;
      color: var(--mp-muted);
      margin: -6px 0 12px;
    }
    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="panel-shell">
    <div id="browser-chrome" hidden>
      <div class="browser-tools">
        <input id="vault-search" type="search" autocomplete="off" data-i18n-placeholder="search">
        <button id="open-generator-btn" type="button" class="icon-btn" data-i18n-aria-label="passwordGenerator" data-i18n-title="passwordGenerator">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <g transform="rotate(-45 12 12)">
              <circle cx="6.5" cy="12" r="3.5"></circle>
              <path d="M10 12h11.5M18.5 12v3M15.5 12v2.5"></path>
            </g>
          </svg>
        </button>
        <button id="add-entry-btn" type="button" class="icon-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="add-entry-menu" data-i18n-aria-label="addItem" data-i18n-title="addItem">+</button>
        <button id="more-menu-btn" type="button" class="icon-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="more-menu" data-i18n-aria-label="moreActions" data-i18n-title="moreActions">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor">
            <circle cx="5.5" cy="12" r="1.6"></circle>
            <circle cx="12" cy="12" r="1.6"></circle>
            <circle cx="18.5" cy="12" r="1.6"></circle>
          </svg>
        </button>
        <div id="add-entry-menu" class="mp-menu" role="menu" data-i18n-aria-label="addItem" hidden></div>
        <div id="more-menu" class="mp-menu" role="menu" data-i18n-aria-label="moreActions" hidden>
          <button id="open-app-menu-btn" type="button" class="mp-menu-item" role="menuitem" tabindex="-1"><span class="mp-menu-label" data-i18n="openMyPass"></span></button>
          <hr class="mp-menu-separator">
          <button id="lock-vault-btn" type="button" class="mp-menu-item" role="menuitem" tabindex="-1"><span class="mp-menu-label" data-i18n="lockMyPass"></span><span id="lock-shortcut-hint" class="mp-menu-shortcut" aria-hidden="true" hidden></span></button>
          <button id="help-menu-btn" type="button" class="mp-menu-item" role="menuitem" tabindex="-1"><span class="mp-menu-label" data-i18n="help"></span></button>
        </div>
        <div id="help-popover" class="mp-menu mp-help" role="dialog" data-i18n-aria-label="help" hidden>
          <button id="help-back-btn" type="button" class="mp-menu-item mp-help-back" data-i18n="helpBack"></button>
          <p class="panel-helper" data-i18n="helpText"></p>
        </div>
      </div>
      <p id="lock-vault-error" role="status" hidden></p>
      <div id="category-wrap" class="category-wrap">
        <button id="category-btn" type="button" data-i18n="categoryFavorites"></button>
        <div id="category-menu" hidden></div>
      </div>
    </div>

    <section id="locked-panel" hidden>
      <img class="brand-logo" src="icons/icon128.png" width="48" height="48" alt="">
      <h1 class="panel-title" id="locked-title"></h1>
      <form id="unlock-form" hidden>
        <div class="unlock-password-field">
          <input id="unlock-password" type="password" autocomplete="current-password" data-i18n-placeholder="masterPassword" data-i18n-aria-label="masterPassword">
          <button id="unlock-reveal-btn" type="button" class="icon-btn" aria-pressed="false" data-i18n-aria-label="showPassword">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7">
              <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/>
            </svg>
          </button>
          <button id="unlock-submit-btn" type="submit" disabled class="btn-primary" data-i18n-aria-label="unlockSubmit">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 12h15m-6-6 6 6-6 6"/>
            </svg>
          </button>
        </div>
        <p id="unlock-error" role="alert" hidden></p>
        <button id="unlock-device-btn" type="button" class="btn-secondary" hidden></button>
      </form>
      <p class="panel-helper" id="locked-helper" hidden></p>
      <button id="launch-app-btn" type="button" class="btn-primary" data-i18n="openMyPass" hidden></button>
    </section>

    <section id="empty-panel" hidden>
      <h1 class="panel-title" id="empty-title"></h1>
    </section>

    <section id="list-panel" hidden>
      <p class="list-header" id="list-header" hidden></p>
      <p id="site-passkey-hint" class="panel-helper" hidden></p>
      <div id="identifier-offer" class="identifier-offer" hidden>
        <p id="identifier-offer-text"></p>
        <div id="identifier-offer-actions" class="identifier-offer-actions"></div>
      </div>
      <ul id="list"></ul>
    </section>

    <section id="pairing-panel" hidden>
      <h1 class="panel-title" id="pairing-title"></h1>
      <div id="code-entry" hidden>
        <p id="code-hint" data-i18n="pairingCodeHint"></p>
        <input id="code-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="7" aria-labelledby="code-hint" />
        <button id="submit-code-btn" type="button" class="btn-primary" data-i18n="sendCode"></button>
      </div>
      <p id="pairing-error" role="alert" hidden></p>
    </section>

    <!-- Every passkey confirm panel shows the relying-party ID and the origin the
         ceremony actually came from. That pairing is the phishing-resistance
         requirement from the design's Global Constraints, not decorative copy. -->
    <section id="passkey-failure-panel" hidden>
      <h1 class="panel-title" data-i18n="passkeyFailureTitle"></h1>
      <p id="passkey-failure-message" class="panel-helper" role="alert"></p>
      <button id="passkey-failure-close-btn" type="button" class="btn-secondary" data-i18n="close"></button>
    </section>

    <section id="passkey-checking-panel" hidden>
      <h1 id="passkey-checking-title" class="panel-title" data-i18n="passkeyPreparing"></h1>
      <p id="passkey-checking-message" class="panel-helper" data-i18n="passkeyWaitingMyPass"></p>
      <button id="passkey-checking-cancel-btn" type="button" class="btn-secondary" data-i18n="cancel"></button>
    </section>

    <section id="prompt-panel" hidden>
      <div id="prompt-card-root"></div>
    </section>

    <section id="passkey-save-panel" hidden>
      <h1 class="panel-title" data-i18n="passkeySaveTitle"></h1>
      <p class="panel-helper passkey-summary" id="passkey-save-summary"></p>
      <dl class="passkey-fields" id="passkey-save-detail"></dl>
      <button id="passkey-save-btn" type="button" class="btn-primary" data-i18n="save"></button>
      <button id="passkey-cancel-btn" type="button" class="btn-secondary" data-i18n="cancel"></button>
    </section>

    <section id="passkey-replace-panel" hidden>
      <h1 class="panel-title" data-i18n="passkeyReplaceTitle"></h1>
      <p class="panel-helper passkey-summary" id="passkey-replace-summary"></p>
      <dl class="passkey-fields" id="passkey-replace-detail"></dl>
      <p class="panel-helper" data-i18n="passkeyReplaceHelper"></p>
      <button id="passkey-replace-btn" type="button" class="btn-primary" data-i18n="replace"></button>
      <button id="passkey-replace-cancel-btn" type="button" class="btn-secondary" data-i18n="cancel"></button>
    </section>

    <section id="passkey-use-panel" hidden>
      <h1 class="panel-title" data-i18n="passkeyUseTitle"></h1>
      <p class="panel-helper passkey-summary" id="passkey-use-summary"></p>
      <dl class="passkey-fields" id="passkey-use-detail"></dl>
      <button id="passkey-approve-btn" type="button" class="btn-primary" data-i18n="approve"></button>
      <button id="passkey-use-cancel-btn" type="button" class="btn-secondary" data-i18n="cancel"></button>
    </section>

    <section id="passkey-picker-panel" hidden>
      <h1 class="panel-title" data-i18n="chooseEntry"></h1>
      <p class="panel-helper passkey-summary" id="passkey-picker-summary"></p>
      <ul id="passkey-picker-list"></ul>
      <button id="passkey-picker-cancel-btn" type="button" class="btn-secondary" data-i18n="cancel"></button>
    </section>

    <div id="generate-password-section" hidden>
      <p id="generate-password-hint" data-i18n="newPasswordFieldHint"></p>
      <button id="generate-password-btn" type="button" class="btn-primary" data-i18n="generatePassword"></button>
      <p id="generate-password-error" hidden></p>
    </div>

    <div id="add-totp-section" hidden>
      <p id="add-totp-hint" data-i18n="totpPasteHint"></p>
      <input id="totp-paste-input" type="text"  data-i18n-placeholder="totpPasteHint"/>
      <button id="add-totp-btn" type="button" class="btn-primary" data-i18n="add"></button>
      <p id="add-totp-error" hidden></p>
    </div>

    <aside id="passkey-diagnostics" aria-live="polite">
      <p id="passkey-proxy-status" class="panel-helper"></p>
      <p id="browser-manager-status" class="panel-helper"></p>
    </aside>

  </div>

  <script src="popup.js"></script>
</body>
