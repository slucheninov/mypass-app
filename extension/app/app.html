<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="extName"></title>
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main>
    <section id="page-settings" hidden>
      <nav id="settings-nav" data-i18n-aria-label="settingsSections">
        <button type="button" data-section="general" data-i18n="sectionGeneral"></button>
        <button type="button" data-section="security" data-i18n="sectionSecurity"></button>
        <button type="button" data-section="autofill" data-i18n="sectionAutofill"></button>
        <button type="button" data-section="notifications" data-i18n="sectionNotifications"></button>
        <button type="button" data-section="appearance" data-i18n="sectionAppearance"></button>
      </nav>
      <div id="settings-panes">
      <section id="settings-general" class="settings-section" hidden>
        <h2 data-i18n="sectionGeneral"></h2>
        <div class="settings-section-body">
          <p class="panel-helper" data-i18n="generalHelper"></p>
          <button id="check-browser-managers-btn" type="button" class="btn-secondary" data-i18n="checkThisBrowser"></button>
          <button id="open-settings-btn" type="button" class="btn-secondary" data-i18n="myPassSettings"></button>
          <p id="settings-open-error" class="panel-helper" role="status" hidden></p>
        </div>
      </section>
      <section id="settings-security" class="settings-section" hidden>
        <h2 data-i18n="sectionSecurity"></h2>
        <div class="settings-section-body">
          <p class="panel-helper" data-i18n="securityHelper"></p>
          <button id="open-mypass-app-btn" type="button" class="btn-secondary" data-i18n="openMyPass"></button>
          <p id="open-mypass-app-error" class="panel-helper" role="status" hidden></p>
          <p class="security-heading" data-i18n="phishingPrevention"></p>
          <label class="security-row">
            <span class="security-copy">
              <strong data-i18n="warnPasteTitle"></strong>
              <p data-i18n="warnPasteHelper"></p>
            </span>
            <span class="security-switch">
              <input id="warn-unrecognized-paste" type="checkbox" checked>
              <span></span>
            </span>
          </label>
          <label class="security-row">
            <span class="security-copy">
              <strong data-i18n="warnCopyTitle"></strong>
              <p data-i18n="warnCopyHelper"></p>
            </span>
            <span class="security-switch">
              <input id="warn-unrecognized-copy" type="checkbox" checked>
              <span></span>
            </span>
          </label>
        </div>
      </section>
      <section id="settings-autofill" class="settings-section" hidden>
        <h2 data-i18n="sectionAutofill"></h2>
        <div class="settings-section-body">
          <p class="panel-helper" data-i18n="autofillHelper"></p>
          <label class="security-row">
            <span class="security-copy">
              <strong data-i18n="offerSaveLoginTitle"></strong>
              <p data-i18n="offerSaveLoginHelper"></p>
            </span>
            <span class="security-switch">
              <input id="offer-save-login" type="checkbox" checked>
              <span></span>
            </span>
          </label>
          <label class="security-row">
            <span class="security-copy">
              <strong data-i18n="offerSaveTotpTitle"></strong>
              <p data-i18n="offerSaveTotpHelper"></p>
            </span>
            <span class="security-switch">
              <input id="offer-save-totp" type="checkbox" checked>
              <span></span>
            </span>
          </label>
          <label class="security-row">
            <span class="security-copy">
              <strong data-i18n="showFieldIconTitle"></strong>
              <p data-i18n="showFieldIconHelper"></p>
            </span>
            <span class="security-switch">
              <input id="show-field-icon" type="checkbox" checked>
              <span></span>
            </span>
          </label>
          <label class="security-row">
            <span class="security-copy">
              <strong data-i18n="autoSubmitTitle"></strong>
              <p data-i18n="autoSubmitHelper"></p>
            </span>
            <span class="security-switch">
              <input id="autofill-auto-submit" type="checkbox">
              <span></span>
            </span>
          </label>
          <label class="security-row">
            <span class="security-copy">
              <strong data-i18n="passkeyOfferTitle"></strong>
              <p data-i18n="passkeyOfferHelper"></p>
            </span>
            <span class="security-switch">
              <input id="autofill-passkey-signin" type="checkbox">
              <span></span>
            </span>
          </label>
          <p id="autofill-passkey-error" class="panel-helper" role="status" hidden></p>
          <p class="security-heading" data-i18n="suggestions"></p>
          <label class="security-row">
            <span class="security-copy">
              <strong data-i18n="showLoginsTitle"></strong>
              <p data-i18n="showLoginsHelper"></p>
            </span>
            <span class="security-switch">
              <input id="suggest-logins" type="checkbox" checked>
              <span></span>
            </span>
          </label>
          <label class="security-row">
            <span class="security-copy">
              <strong data-i18n="showCardsTitle"></strong>
              <p data-i18n="showCardsHelper"></p>
            </span>
            <span class="security-switch">
              <input id="suggest-cards" type="checkbox" checked>
              <span></span>
            </span>
          </label>
          <label class="security-row">
            <span class="security-copy">
              <strong data-i18n="showAddressesTitle"></strong>
              <p data-i18n="showAddressesHelper"></p>
            </span>
            <span class="security-switch">
              <input id="suggest-addresses" type="checkbox" checked>
              <span></span>
            </span>
          </label>
        </div>
      </section>
      <section id="settings-notifications" class="settings-section" hidden>
        <h2 data-i18n="sectionNotifications"></h2>
        <div class="settings-section-body">
          <p class="panel-helper" data-i18n="notificationsHelper"></p>
          <label class="security-row">
            <span class="security-copy">
              <strong data-i18n="notifyPasskeyTitle"></strong>
              <p data-i18n="notifyPasskeyHelper"></p>
            </span>
            <span class="security-switch">
              <input id="notify-passkey-confirmation" type="checkbox" checked>
              <span></span>
            </span>
          </label>
          <label class="security-row">
            <span class="security-copy">
              <strong data-i18n="notifyUnlockedTitle"></strong>
              <p data-i18n="notifyUnlockedHelper"></p>
            </span>
            <span class="security-switch">
              <input id="notify-vault-unlocked" type="checkbox" checked>
              <span></span>
            </span>
          </label>
        </div>
      </section>
      <section id="settings-appearance" class="settings-section" hidden>
        <h2 data-i18n="sectionAppearance"></h2>
        <div class="settings-section-body">
          <p class="panel-helper" data-i18n="appearanceHelper"></p>
          <label class="appearance-row">
            <span data-i18n="theme"></span>
            <select id="appearance-theme">
              <option value="system" selected data-i18n="themeSystem"></option>
              <option value="light" data-i18n="themeLight"></option>
              <option value="dark" data-i18n="themeDark"></option>
            </select>
          </label>
          <p class="security-heading" data-i18n="shortcuts"></p>
          <div class="appearance-row">
            <span data-i18n="commandOpen"></span>
            <kbd id="shortcut-open" data-i18n="shortcutNotSet"></kbd>
          </div>
          <div class="appearance-row">
            <span data-i18n="commandLock"></span>
            <kbd id="shortcut-lock" data-i18n="shortcutNotSet"></kbd>
          </div>
          <p class="panel-helper"><span data-i18n="shortcutsHelper"></span> <button id="open-shortcut-settings" type="button" class="appearance-link" data-i18n="chromeShortcutsPage"></button></p>
        </div>
      </section>
      </div>
    </section>
    <section id="page-not-found" hidden><p data-i18n="pageNotFound"></p></section>
  </main>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/autofill-settings.js"></script>
  <script src="../shared/notification-settings.js"></script>
  <script src="../shared/security-watch.js"></script>
  <script src="../shared/appearance-settings.js"></script>
  <script src="../shared/theme.js"></script>
  <script src="router.js"></script>
  <script src="app.js"></script>
</body>
</html>
